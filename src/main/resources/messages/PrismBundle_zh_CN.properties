# Prism Brackets — Simplified Chinese strings

## Settings page
settings.display.name=Prism Brackets
settings.rainbow=启用彩虹括号
settings.scope=启用作用域高亮（默认关闭）
settings.variables=启用彩虹变量 / 类型 / 方法（语义高亮）
settings.keyword=启用关键字着色（覆盖配色方案的关键字颜色）
settings.string=启用字符串着色（比默认更鲜艳）
settings.indent=启用缩进线高亮
settings.scope.opacity=作用域填充不透明度（%）：
settings.color.count=颜色数量（2–10）：

## Color settings page
color.page.display.name=Prism Brackets
color.page.bracket=括号 {0}
color.page.variable=变量 {0}
color.page.type=类型 {0}
color.page.method=方法 {0}
color.page.keyword=关键字 {0}
color.page.string=字符串
color.page.indent=缩进线 {0}
